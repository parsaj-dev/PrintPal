name: Build Windows exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install zbar DLL
        run: |
          # vcpkg has zbar; install it and make the DLL available
          vcpkg install zbar:x64-windows
          $dllDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          # Copy to pyzbar package dir so it can find it
          $pyzbarDir = python -c "import pyzbar, os; print(os.path.dirname(pyzbar.__file__))"
          Copy-Item "$dllDir\zbar*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          Copy-Item "$dllDir\libzbar*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          # Also copy libiconv if present
          Copy-Item "$dllDir\libiconv*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          Get-ChildItem $pyzbarDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          # Add to PATH for the build
          echo "$dllDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        shell: pwsh

      - name: Verify pyzbar loads
        run: python -c "from pyzbar.pyzbar import decode; print('pyzbar OK')"

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Build exe
        run: pyinstaller printpal.spec

      - name: Verify exe
        run: |
          if (!(Test-Path "dist/PrintPal.exe")) { throw "PrintPal.exe not found" }
          $mb = [math]::Round((Get-Item "dist/PrintPal.exe").Length / 1MB, 1)
          Write-Host "PrintPal.exe: $mb MB"
        shell: pwsh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintPal.exe
          generate_release_notes: true
