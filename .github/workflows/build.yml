name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Manual builds (Actions tab -> Run workflow, or the API) produce downloadable
  # artifacts without cutting a tagged release -- handy for trying a branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install zbar DLL
        run: |
          vcpkg install zbar:x64-windows
          $dllDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          $pyzbarDir = python -c "import pyzbar, os; print(os.path.dirname(pyzbar.__file__))"
          Copy-Item "$dllDir\zbar*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          Copy-Item "$dllDir\libzbar*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          Copy-Item "$dllDir\libiconv*.dll" -Destination $pyzbarDir -ErrorAction SilentlyContinue
          echo "$dllDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        shell: pwsh

      - name: Verify pyzbar loads
        run: python -c "from pyzbar.pyzbar import decode; print('pyzbar OK')"

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Build with PyInstaller (one-folder)
        run: pyinstaller printpal.spec

      - name: Verify build
        run: |
          if (!(Test-Path "dist/PrintPal/PrintPal.exe")) { throw "PrintPal.exe not found" }
          if (!(Test-Path "dist/PrintPal/PrintPalPort.exe")) { throw "PrintPalPort.exe not found" }
          if (!(Test-Path "dist/PrintPal/install_printer.ps1")) { throw "install_printer.ps1 not bundled" }
          $mb = [math]::Round((Get-Item "dist/PrintPal/PrintPal.exe").Length / 1MB, 1)
          Write-Host "PrintPal.exe: $mb MB"
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Verify installer
        run: |
          if (!(Test-Path "installer_output/PrintPal-Setup.exe")) { throw "Installer not found" }
          $mb = [math]::Round((Get-Item "installer_output/PrintPal-Setup.exe").Length / 1MB, 1)
          Write-Host "PrintPal-Setup.exe: $mb MB"
        shell: pwsh

      - name: Create portable zip
        run: Compress-Archive -Path "dist/PrintPal/*" -DestinationPath "PrintPal-Portable.zip"
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintPal-${{ github.sha }}
          path: |
            installer_output/PrintPal-Setup.exe
            PrintPal-Portable.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/PrintPal-Setup.exe
            PrintPal-Portable.zip
          body: |
            ## Download

            **Recommended:** Download `PrintPal-Setup.exe` to install PrintPal with Start Menu shortcuts, desktop shortcut, and Add/Remove Programs entry.

            **Portable:** Download `PrintPal-Portable.zip`, extract anywhere, and run `PrintPal.exe` directly.
